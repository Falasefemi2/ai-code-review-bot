name: AI Code Review

# Reusable workflow: callers reference this file with `uses:` and pass
# GROQ_API_KEY as an explicit secret. GITHUB_TOKEN is intentionally NOT a
# secret input — each caller repo's auto-provided secrets.GITHUB_TOKEN is
# available inside the called workflow run automatically, so PR comments
# post with the correct repo's permissions.
on:
  workflow_call:
    secrets:
      GROQ_API_KEY:
        required: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Push events need the full history so the diff endpoint can
          # resolve base/head SHAs correctly when the PR was opened from
          # the branch being pushed.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run AI code review
        run: bun run src/index.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
