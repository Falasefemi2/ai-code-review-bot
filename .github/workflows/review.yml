name: AI Code Review

# Reusable workflow: callers reference this file with `uses:` and pass
# GROQ_API_KEY as an explicit secret. GITHUB_TOKEN is intentionally NOT a
# secret input — each caller repo's auto-provided secrets.GITHUB_TOKEN is
# available inside the called workflow run automatically, so PR comments
# post with the correct repo's permissions.
on:
  workflow_call:
    secrets:
      GROQ_API_KEY:
        required: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      # IMPORTANT: checkout the BOT repository (the repo that owns this
      # workflow), NOT the triggering/caller repo. A reusable workflow's
      # default `actions/checkout` checks out the CALLER repo (easyrent-fe),
      # which never contains src/index.ts — that is what caused
      # `Module not found "src/index.ts"`. The bot targets the caller repo via
      # the GITHUB_REPOSITORY env var (set automatically in the caller's
      # context) and fetches the diff from the GitHub API, so it needs no local
      # copy of the target repo.
      - name: Checkout bot source
        uses: actions/checkout@v4
        with:
          repository: Falasefemi2/ai-code-review-bot
          ref: main
          path: bot

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: bot
        run: bun install --frozen-lockfile

      - name: Run AI code review
        working-directory: bot
        run: bun run src/index.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
